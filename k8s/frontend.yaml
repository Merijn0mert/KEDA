apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: keda-poc-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          # De Vite dev-server proxyt /api → http://producer:8000
          # Dit werkt in Kubernetes omdat de Service ook "producer" heet
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
  # NodePort maakt de UI bereikbaar van buiten het cluster (bijv. minikube)
  # Verander naar LoadBalancer als je een cloud cluster gebruikt
  type: NodePort
