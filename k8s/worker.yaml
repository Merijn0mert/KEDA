apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  # KEDA beheert dit veld dynamisch (0 - maxReplicaCount).
  # Start op 0 zodat scale-to-zero meteen klopt.
  replicas: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 5 # geeft de worker tijd om de huidige job af te ronden bij scale-down
      containers:
        - name: worker
          image: keda-poc-worker:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: QUEUE_NAME
              value: jobs
            - name: PROCESSING_TIME_SECONDS
              value: "5"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          
