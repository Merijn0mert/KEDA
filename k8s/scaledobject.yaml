apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-trigger-auth
spec:
  secretTargetRef:
    - parameter: username
      name: rabbitmq-credentials
      key: username
    - parameter: password
      name: rabbitmq-credentials
      key: password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaler
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 10
  # Hoe vaak KEDA de queue checkt (in seconden)
  pollingInterval: 5
  # Hoe lang wachten na de laatste actieve metric voordat naar minReplicaCount geschaald wordt
  cooldownPeriod: 10
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        hostFromEnv: ""
        host: "http://rabbitmq.default.svc.cluster.local:15672"
        queueName: jobs
        # QueueLength met includeUnacked telt ready + unacked berichten samen.
        # Zo schaalt KEDA niet terug terwijl workers nog bezig zijn met jobs.
        mode: QueueLength
        includeUnacked: "true"
        value: "10"
        vhostName: "/"
      authenticationRef:
        name: rabbitmq-trigger-auth
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          # Zonder dit blok schaalt de HPA in stappen op (met wachttijd
          # ertussen), zelfs als KEDA al weet dat er 10 workers nodig
          # zijn. Dit zorgt dat hij in 1x naar het volledige berekende
          # aantal mag springen.
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 10
              periodSeconds: 15
        scaleDown:
          # Zonder dit blok gebruikt de HPA de default van 5 minuten
          # stabilisatie voor scale-down, ongeacht cooldownPeriod hierboven.
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15